<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="영철 주식 데스크 — 관심종목 실적·밸류에이션·핵심 지표 (SEC 공시 기준, 매일 13시 KST 갱신)">
<meta name="robots" content="noindex">
</head>
<body>
<title>영철 주식 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: a two-tier desk — market strip with a fear/greed dial on top, a watchlist ledger below; each ticker opens as one valuation sheet. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#f5f7f9; --ink:#15202b; --muted:#5b6977; --faint:#8a97a3; --line:#d9e0e6;
  --accent:#0d6e6a; --accent-soft:#d8ecea;
  --up:#d1343f; --up-soft:#fbe4e5; --down:#1f62cc; --down-soft:#e0eafb; --flat:#6b7682;
  --warn:#b7791f;
  --sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
  --hm-bg:#0a0d11; --hm-head:#465263; --hm-headfg:#f2f5f8; --hm-fg:#ffffff;
  --hm-secline:#6b7889; --hm-ind:#1f2630; --hm-indfg:#b9c3ce; --hm-indline:#0a0d11;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151e27; --sunk:#111921; --ink:#e4ebf1; --muted:#93a1ae; --faint:#6c7a87; --line:#24313d;
  --accent:#3fb7b0; --accent-soft:#163533;
  --up:#ff6b72; --up-soft:#3a1a1e; --down:#5f9bff; --down-soft:#152640; --flat:#8b97a2; --warn:#e0a344;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151e27; --sunk:#111921; --ink:#e4ebf1; --muted:#93a1ae; --faint:#6c7a87; --line:#24313d;
  --accent:#3fb7b0; --accent-soft:#163533;
  --up:#ff6b72; --up-soft:#3a1a1e; --down:#5f9bff; --down-soft:#152640; --flat:#8b97a2; --warn:#e0a344;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand h1 b{color:var(--accent);font-family:var(--mono);font-weight:700;margin-right:6px}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pill.closed::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08);color:var(--surface)}
.btn.danger{border-color:var(--up);color:var(--up)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600}

/* banners */
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.banner.warn{border-color:var(--warn)}
.note{font-size:12px;color:var(--faint)}
.err{font-size:12px;color:var(--warn)}

/* market strip */
.market{display:grid;grid-template-columns:minmax(240px,300px) 1fr;gap:14px}
@media (max-width:760px){.market{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.fg{display:flex;flex-direction:column;gap:6px}
.fg svg{width:100%;max-width:280px;align-self:center;display:block}
.fg-score{font-family:var(--mono);font-size:30px;font-weight:700;text-align:center;line-height:1}
.fg-word{text-align:center;font-weight:700;font-size:14px}
.fg-prev{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:11px;color:var(--muted)}
.fg-prev b{display:block;font-family:var(--mono);font-size:13px;color:var(--ink)}
.fg-parts{display:grid;grid-template-columns:1fr auto 56px;gap:3px 8px;font-size:12px;margin-top:4px;align-items:center}
.fg-parts .bar{height:6px;border-radius:3px;background:var(--sunk);position:relative;overflow:hidden;grid-column:1/-1}
.fg-parts .bar i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.fg-parts .bar i.ghost{opacity:.28}
.fg-parts .bar .prevmark{position:absolute;top:-1px;bottom:-1px;width:2px;margin-left:-1px;background:var(--ink);opacity:.45;border-radius:1px}
.fg-parts .fg-d{font-style:normal;font-size:10px;margin-left:3px;font-weight:600}
.fg-legend{grid-column:1/-1;display:flex;gap:12px;font-size:10.5px;color:var(--faint);margin-top:2px}
.fg-legend span{display:inline-flex;align-items:center;gap:4px}
.fg-legend .sw{display:inline-block;width:14px;height:5px;border-radius:2px;background:var(--muted)}
.fg-legend .sw.ghost{opacity:.3}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{background:var(--surface);padding:11px 13px;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative;overflow:hidden}
.tile>*:not(.spark){position:relative;z-index:1}
.tile .spark{position:absolute;left:0;right:0;bottom:0;height:62%;width:100%;pointer-events:none;opacity:.5}
.tile .v{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .c{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.tile .s{font-size:11px;color:var(--faint)}
.tile.key{background:var(--sunk)}

/* heatmap */
.hm-panel{display:flex;flex-direction:column;gap:12px;padding:16px 18px}
.hm-legend{display:flex;align-items:center;gap:2px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.hm-legend i{display:block;width:22px;height:12px}
.hm-legend span{padding:0 6px}
.hm{position:relative;width:100%;height:640px;background:var(--hm-bg);border-radius:8px;overflow:hidden}
@media (max-width:700px){.hm{height:720px}}
.hm-back{align-self:flex-start}
.hm-ind{position:absolute;box-shadow:inset 0 0 0 1px var(--hm-indline)}
.hm-ind-label{position:absolute;left:0;right:0;top:0;height:15px;padding:0 5px;font-size:9.5px;font-weight:600;line-height:15px;color:var(--hm-indfg);background:var(--hm-ind);border-left:2px solid var(--hm-secline);display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.hm-ind-label span{overflow:hidden;text-overflow:ellipsis}
.hm-ind-label em{font-style:normal;font-family:var(--mono)}
.hm-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--hm-headfg);font-size:13px}
.hm-sec{position:absolute;background:var(--hm-bg);box-shadow:0 0 0 1.5px var(--hm-secline);border-radius:3px;overflow:hidden}
.hm-sec-label{position:absolute;left:0;right:0;top:0;height:20px;padding:0 7px;border:0;cursor:zoom-in;text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--hm-headfg);background:var(--hm-head);display:flex;justify-content:space-between;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.hm-sec-label em{font-style:normal;font-family:var(--mono);font-weight:600}
.hm-tile{position:absolute;border:1px solid var(--hm-bg);color:var(--hm-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;overflow:hidden;line-height:1.05;font-family:var(--mono);font-variant-numeric:tabular-nums}
.hm-tile b{font-weight:700;letter-spacing:.01em}
.hm-tile span{opacity:.92}
.hm-tile.mine{outline:2px solid #ffd54a;outline-offset:-3px;cursor:pointer}
.hm-tile.mine:hover{filter:brightness(1.15)}
.hm-sectors{display:flex;flex-wrap:wrap;gap:6px}
.hm-sectors span,.hm-sectors button{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.hm-sectors button{cursor:zoom-in}
.hm-sectors button:hover{border-color:var(--accent)}
.hm-sec-label:hover{filter:brightness(1.3)}
.hm-sectors b{font-family:var(--mono);font-weight:600;margin-left:4px}

/* watchlist */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:16px;font-weight:700}
.addform{display:flex;gap:6px}
.addform input{width:150px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;text-transform:uppercase;font-family:var(--mono)}
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(150px,1.6fr) 1fr .8fr .8fr 1.1fr .9fr .7fr .9fr 30px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{background:var(--sunk);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;padding-block:7px}
.row.item{cursor:pointer}
.row.item:hover{background:var(--sunk)}
.row .r{text-align:right}
.tk{display:flex;flex-direction:column;min-width:0}
.tk b{font-family:var(--mono);font-size:14px}
.tk span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.range{position:relative;height:6px;background:var(--sunk);border-radius:3px;border:1px solid var(--line)}
.range i{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.chg{display:inline-block;padding:1px 7px;border-radius:5px;font-family:var(--mono);font-size:12px;font-weight:600}
.chg.up{background:var(--up-soft)} .chg.down{background:var(--down-soft)}
.rating{font-size:12px;font-weight:600;white-space:nowrap}
.rsi{display:inline-flex;align-items:baseline;gap:4px;font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap}
.rsi small{font-family:var(--sans);font-size:10px;font-weight:600}
.rsi.hot{color:var(--up)} .rsi.cold{color:var(--down)}
.ledger.sortable .row{position:relative;padding-left:34px}
.grip{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:26px;height:34px;border:0;background:none;border-radius:6px;color:var(--faint);cursor:grab;touch-action:none;display:grid;place-items:center;padding:0}
.grip svg{width:12px;height:18px;fill:currentColor}
.grip:hover,.grip:focus-visible{color:var(--ink);background:var(--sunk)}
.row.dragging{background:var(--surface);box-shadow:0 6px 22px rgba(0,0,0,.18);z-index:2;outline:1px solid var(--accent);outline-offset:-1px}
.row.dragging .grip{cursor:grabbing;color:var(--accent)}
body.is-dragging,body.is-dragging *{user-select:none;-webkit-user-select:none;cursor:grabbing}
.x{border:0;background:none;color:var(--faint);font-size:16px;line-height:1;padding:4px;border-radius:6px}
.x:hover{color:var(--up);background:var(--up-soft)}
.x.confirm{color:var(--surface);background:var(--up);font-size:11px;font-weight:700;padding:4px 6px;white-space:nowrap}
.empty{padding:26px 16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px dashed var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 11px;font-family:var(--mono);font-size:12px;font-weight:600}
@media (max-width:760px){
  .row{grid-template-columns:minmax(0,1fr) auto auto 30px;row-gap:4px}
  .row.head{display:none}
  .row .hide-s{display:none}
  .row .m-sub{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .row .m-sub{gap:5px}
  .row .m-sub>span{background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .row{padding:12px 14px;column-gap:10px}
  .tk b{font-size:16px}
  .tk span{font-size:12.5px}
  .row .r.mono{font-size:15px}
  .chg{font-size:13px;padding:2px 8px}
  .addform{width:100%}
  .addform input{flex:1;width:auto;min-width:0;font-size:16px;padding:8px 10px}
}
@media (min-width:761px){.row .m-sub{display:none}}

/* detail */
.back{align-self:flex-start}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:14px 20px}
@media (max-width:700px){.hero{grid-template-columns:1fr}}
.hero .id h2{font-size:22px;font-weight:700;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hero .id h2 b{font-family:var(--mono);color:var(--accent)}
.hero .id .sub{font-size:13px;color:var(--muted)}
.hero .px{text-align:right}
@media (max-width:700px){.hero .px{text-align:left}}
.hero .px .v{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1.1}
.hero .facts{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px 18px;border-top:1px solid var(--line);padding-top:12px}
.fact{display:flex;flex-direction:column;gap:1px;min-width:0}
.fact .v{font-family:var(--mono);font-size:14px;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
/* the detail view is a centered flex item: pin it to the column width so wide tables scroll inside their cards instead of widening the page (on phones that zoomed the whole page out) */
#detail{width:100%;min-width:0}
#detail>*{min-width:0}
.card,.hero{scroll-margin-top:104px}
/* phone: sticky ticker bar + section jumps */
.mbar{display:none}
@media (max-width:760px){
  .mbar{display:flex;flex-direction:column;gap:8px;position:sticky;top:0;z-index:20;margin:-20px -16px 0;padding:10px 16px 8px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .mb-top{display:flex;align-items:center;gap:10px}
  .mb-back{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;font-size:18px;line-height:1;display:grid;place-items:center;flex:none}
  .mb-t{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--accent)}
  .mb-px{margin-left:auto;text-align:right;font-family:var(--mono);font-weight:700;font-size:17px;line-height:1.15}
  .mb-px small{display:block;font-size:12px;font-weight:600}
  .mnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
  .mnav::-webkit-scrollbar{display:none}
  .mnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
  .mnav button:active{border-color:var(--accent);color:var(--accent)}
  #detail>.back{display:none}
  .hero .id h2{font-size:19px}
  .hero .px .v{font-size:28px}
  .hero .facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
  .fact .v{font-size:15px}
  .card h3{font-size:16px}
  .kv{font-size:14px}
  .kv .v{white-space:normal;overflow-wrap:anywhere;padding-left:10px}
  .note{font-size:12.5px}
  .links{font-size:14px;gap:10px 16px}
  table.t{font-size:13px}
  table.t th:first-child,table.t td:first-child{box-shadow:6px 0 6px -6px rgba(0,0,0,.18)}
}
/* table labels stay visible while the numbers scroll sideways */
table.t th:first-child,table.t td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);padding-right:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 small{font-weight:400;font-size:11px;color:var(--faint)}
.big2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.big2>div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 16px 13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.big2 .lbl{font-size:11px}
.big2 .v{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big2 .note{margin-top:auto;font-size:12px}
.big2.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.big2.three>div{padding:12px 12px 13px}
.big2.three .v{font-size:21px}
.card{gap:16px}
.card>h3,.card>.chart-head{padding-bottom:10px;border-bottom:1px solid var(--line)}
.card{padding:18px 20px}
@media (max-width:600px){.card{padding:14px 14px}.big2{grid-template-columns:repeat(2,minmax(0,1fr))}.big2 .v{font-size:20px}.big2.three>div{padding:10px 9px}.big2.three .v{font-size:16px}}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0;font-size:13px}
.kv>div{padding:6px 0;border-top:1px dashed var(--line)}
.kv>div:nth-child(-n+2){border-top:0}
.kv .v{font-family:var(--mono);text-align:right;font-weight:600}
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px;min-width:620px}
table.t th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:0}
table.t td{padding:7px 8px;border-bottom:1px dashed var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td:first-child{font-family:var(--sans);color:var(--ink)}
table.t tr:last-child td{border-bottom:0}
table.t td.hl{font-weight:700}
table.t.bs{min-width:0}
table.t.bs td:first-child{white-space:normal}
table.qt th,table.qt td{border-left:1px dashed var(--line)}
table.qt th:first-child,table.qt td:first-child{border-left:0}
table.qt td{border-bottom-style:solid}
table.qt tbody tr:nth-child(even) td{background:var(--sunk)}
table.qt th.cur,table.qt td.cur{background:var(--accent-soft);border-left:1.5px solid var(--accent);border-right:1.5px solid var(--accent)}
table.qt th.cur{color:var(--accent);border-top:1.5px solid var(--accent);border-radius:6px 6px 0 0}
table.qt tbody tr:last-child td.cur{border-bottom:1.5px solid var(--accent)}

<div class="wrap" id="app">

    </div>
    <div class="status">
      <span class="pill closed" id="mkt-state">시장 상태 확인 중</span>
      <span id="asof" class="mono"></span>

  </header>

  <div id="conn" hidden></div>

  <!-- HOME -->

        <div class="fg-score" id="fg-score">–</div>
        <div class="fg-word" id="fg-word">계산 중</div>

          <span>−3%</span><i style="background:rgb(37,99,214)"></i><i style="background:rgb(42,82,150)"></i><i style="background:rgb(48,70,105)"></i><i style="background:rgb(58,64,75)"></i><i style="background:rgb(110,58,70)"></i><i style="background:rgb(162,53,65)"></i><i style="background:rgb(214,48,60)"></i><span>+3%</span>
        </div>

      <div class="note" id="hm-note">상자 크기는 시가총액, 색은 하루 등락률이에요(상승 빨강 · 하락 파랑). 섹터 이름이나 아래 칩을 누르면 그 섹터만 크게 펼쳐서 업종별로 볼 수 있어요. 관심종목은 노란 테두리, 누르면 상세로 들어가요.</div>

<script>
(() => {
"use strict";
const SUGGEST = ["NVDA", "TSLA", "INV", "005930.KS"];

let db = null, canEdit = false;
let snap = null;          // published data.json
let snapErr = null;
let drag = null, dragEndAt = 0, pendingLedger = false;   // home list reordering
let watchDocs = null;    // owner's editable list from db (null = not available)
let localOrder = null;   // order the owner just set, shown until the db confirms it
let memos = {};           // docId -> {myTarget, note}
let current = null;
let pendingHash = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const cls = v => !isNum(v) || v === 0 ? "flat" : v > 0 ? "up" : "down";
const sign = v => v > 0 ? "+" : v < 0 ? "−" : "";
const fx = (v, d = 2) => isNum(v) ? Math.abs(v).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d}) : "–";
const fnum = (v, d = 2) => isNum(v) ? (v < 0 ? "−" : "") + fx(v, d) : "–";
const fpct = (v, d = 1) => isNum(v) ? sign(v) + fx(v * 100, d) + "%" : "–";
const fpctRaw = (v, d = 1) => isNum(v) ? (v < 0 ? "−" : "") + fx(v * 100, d) + "%" : "–";
const fbig = (v, cur) => {
  if (!isNum(v)) return "–";
  const s = v < 0 ? "−" : "", a = Math.abs(v);
  if (cur === "KRW") {
    if (a >= 1e12) return s + "₩" + fx(a / 1e12, 1) + "조";
    if (a >= 1e8) return s + "₩" + fx(a / 1e8, 0) + "억";
    return s + "₩" + fx(a, 0);
  }
  const p = cur && cur !== "USD" ? "" : "$";
  if (a >= 1e12) return s + p + fx(a / 1e12, 2) + "T";
  if (a >= 1e9) return s + p + fx(a / 1e9, 2) + "B";
  if (a >= 1e6) return s + p + fx(a / 1e6, 1) + "M";
  return s + p + fx(a, 0);
};
const fpx = (v, cur) => !isNum(v) ? "–" : cur === "KRW" ? "₩" + fx(v, 0) : (cur && cur !== "USD" ? "" : "$") + fx(v, 2);
const lin = (v, a, b) => Math.max(0, Math.min(100, (v - a) / (b - a) * 100));
const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
const nums = a => Array.isArray(a) ? a.filter(isNum) : [];
const docId = t => t.replace(/[^A-Z0-9]/g, "_");
const kst = iso => { try { return new Date(iso).toLocaleString("ko-KR", {timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false}); } catch { return ""; } };

/* ---------- snapshot ---------- */
async function loadSnapshot() {
  try {
    const r = await fetch("data.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    snap = await r.json(); snapErr = null;
  } catch (e) { snapErr = e; }
  renderAll();
}
const stockData = t => snap && snap.stocks && snap.stocks[t] || null;
const quoteOf = t => (stockData(t) || {}).info || null;

function renderStatus() {
  const el = $("#mkt-state"), as = $("#asof");
  if (!snap) {
    el.className = "pill closed";
    el.textContent = snapErr ? "데이터를 아직 받지 못했어요" : "불러오는 중";
    return;
  }
  const st = snap.market && snap.market.status && snap.market.status.state;
  el.className = "pill " + (st === "open" ? "live" : "closed");
  el.textContent = st === "open" ? "미국 정규장 진행 중" : st === "pre" ? "프리마켓" : st === "post" ? "애프터마켓" : "미국장 마감";
  const age = (Date.now() - new Date(snap.updatedAt).getTime()) / 36e5;
  as.innerHTML = `마지막 갱신 ${esc(kst(snap.updatedAt))} KST${age > 8 ? ` <span class="err">(${Math.floor(age)}시간 전)</span>` : ""}`;
}

/* ---------- market tiles ---------- */
function renderTiles() {
  const ov = snap && snap.market;
  const by = {};
  (ov && ov.instruments || []).forEach(i => by[i.symbol] = i);
  const sp = (snap && snap.spark) || {};
  const tile = (label, i, opt = {}) => {
    if (!i || !isNum(i.last)) return `<div class="tile ${opt.key ? "key" : ""}"><span class="lbl">${label}</span><span class="v faint">–</span></div>`;
    const c0 = opt.invert ? cls(-i.change) : cls(i.change);
    const spark = sparkSvg(sp[i.symbol], isNum(i.change) ? i.last - i.change : NaN, c0 === "up" ? "var(--up)" : c0 === "down" ? "var(--down)" : "var(--flat)");
    const chg = opt.bp ? `${sign(i.change)}${fx(i.change * 100, 1)}bp` : `${sign(i.change)}${fx(i.change, opt.d ?? 2)} (${sign(i.change_percent)}${fx(i.change_percent, 2)}%)`;
    const c = opt.invert ? cls(-i.change) : cls(i.change);
    return `<div class="tile ${opt.key ? "key" : ""}">${spark}<span class="lbl">${label}</span>
      <span class="v">${opt.pre || ""}${fx(i.last, opt.vd ?? 2)}${opt.suf || ""}</span>
      <span class="c ${c}">${isNum(i.change) ? chg : ""}</span>${opt.s ? `<span class="s">${opt.s}</span>` : ""}</div>`;
  };
  const tnx = by["^TNX"], two = snap && snap.two;
  const twoTile = two && isNum(two.last)
    ? `<div class="tile key"><span class="lbl">미 국채 2년물</span><span class="v">${fx(two.last, 3)}%</span><span class="c ${cls(two.change)}">${isNum(two.change) ? sign(two.change) + fx(two.change * 100, 1) + "bp" : ""}</span><span class="s">2년 수익률 선물 · ${esc(two.date || "")}</span></div>`
    : `<div class="tile key"><span class="lbl">미 국채 2년물</span><span class="v faint">–</span></div>`;
  const vix = by["^VIX"];
  $("#tiles").innerHTML = [
    tile("VIX 변동성", vix, {key: 1, invert: 1, s: vix ? (vix.last >= 30 ? "공포 구간 (30↑)" : vix.last >= 20 ? "경계 구간 (20↑)" : "안정 구간") : ""}),
    twoTile,
    tile("미 국채 10년물", tnx, {key: 1, bp: 1, suf: "%", vd: 3}),
    tile("미 국채 30년물", by["^TYX"], {key: 1, bp: 1, suf: "%", vd: 3}),
    tile("달러 인덱스", by["DX-Y.NYB"], {key: 1, s: "DXY"}),
    tile("원/달러", by["KRW=X"], {key: 1, s: "USD/KRW"}),
    tile("S&P 500", by["^GSPC"]),
    tile("나스닥", by["^IXIC"]),
    tile("다우", by["^DJI"]),
    tile("WTI 원유", by["CL=F"], {pre: "$"}),
    tile("브렌트유", by["BZ=F"], {pre: "$"}),
    tile("금", by["GC=F"], {pre: "$", vd: 1, d: 1}),
  ].join("");
  fitTiles();
}
/* pick a column count that divides the tile count, so rows are always full */
function fitTiles() {
  const g = $("#tiles"), ts = g && g.children;
  if (!ts || !ts.length) return;
  const n = ts.length, w = g.clientWidth;
  const opts = [6, 5, 4, 3, 2].filter(c => w / c >= 128);
  const cols = opts.find(c => n % c === 0) || opts[0] || 2;
  g.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  const last = ts[n - 1], rem = n % cols;
  last.style.gridColumn = rem ? `span ${cols - rem + 1}` : "";
}
try { new ResizeObserver(() => fitTiles()).observe($("#tiles")); } catch {}

function sparkSvg(arr, base, col) {
  const a = nums(arr);
  if (a.length < 4) return "";
  let lo = Math.min(...a), hi = Math.max(...a);
  if (isNum(base)) { lo = Math.min(lo, base); hi = Math.max(hi, base); }
  const span = hi - lo || 1, W = 100, H = 40, pad = 3;
  const X = i => i / (a.length - 1) * W, Y = v => pad + (hi - v) / span * (H - pad * 2);
  const line = a.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(2)} ${Y(v).toFixed(2)}`).join(" ");
  let s = `<path d="${line} L${W} ${H} L0 ${H}Z" fill="${col}" fill-opacity=".14"/>`;
  if (isNum(base)) s += `<line x1="0" x2="${W}" y1="${Y(base).toFixed(2)}" y2="${Y(base).toFixed(2)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2" vector-effect="non-scaling-stroke" opacity=".7"/>`;
  s += `<path d="${line}" fill="none" stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${s}</svg>`;
}

/* ---------- fear & greed (approximation, weekly closes) ---------- */
const FG_KO = {"extreme fear": "극단적 공포", "fear": "공포", "neutral": "중립", "greed": "탐욕", "extreme greed": "극단적 탐욕"};
const FG_PART_KO = {market_momentum_sp500: "S&P 모멘텀", stock_price_strength: "주가 강도(신고가·신저가)", stock_price_breadth: "주가 폭(거래량 확산)", put_call_options: "풋/콜 옵션 비율", market_volatility_vix: "변동성(VIX)", junk_bond_demand: "정크본드 수요", safe_haven_demand: "안전자산 수요"};
const fgColor = v => v < 45 ? "var(--down)" : v <= 55 ? "var(--flat)" : "var(--up)";
function renderCnnFG(c) {
  const score = Math.round(c.score);
  const col = fgColor(c.score);
  $("#fg-score").textContent = score; $("#fg-score").style.color = col;
  $("#fg-word").textContent = FG_KO[String(c.rating || "").toLowerCase()] || c.rating || ""; $("#fg-word").style.color = col;
  drawGauge(c.score);
  const pv = c.prev || {};
  const cell = (l, v) => `<div>${l}<b style="color:${isNum(v) ? fgColor(v) : "var(--faint)"}">${isNum(v) ? Math.round(v) : "–"}</b></div>`;
  $("#fg-prev").innerHTML = cell("전일", pv.close) + cell("1주 전", pv.w1) + cell("1개월 전", pv.m1) + cell("1년 전", pv.y1);
  $("#fg-parts").innerHTML = (c.parts || []).filter(p => isNum(p.score)).map(p => {
    const pc = fgColor(p.score), hasPrev = isNum(p.prev), dlt = hasPrev ? p.score - p.prev : NaN;
    const dl = hasPrev && Math.round(dlt) !== 0 ? `<em class="fg-d ${dlt > 0 ? "up" : "down"}">${dlt > 0 ? "▲" : "▼"}${Math.abs(Math.round(dlt))}</em>` : "";
    return `<span>${esc(FG_PART_KO[p.k] || p.k)}</span><span class="faint" style="font-size:11px">${esc(FG_KO[String(p.rating || "").toLowerCase()] || "")}</span><span class="mono" style="text-align:right;font-weight:600;color:${pc}">${Math.round(p.score)}${dl}</span>

/* group a total row with its component rows: components collapse under the total (click to expand) */
let togSeq = 0;
function groupRows(rows) {
  // returns [{row, role: "plain"|"parent"|"kid", id}] in display order
  const out = [], byLabel = new Map(rows.map(r => [r.label, r]));
  const kidOf = new Map();
  rows.forEach(r => (r.kids || []).forEach(l => { if (byLabel.has(l)) kidOf.set(l, r.label); }));
  let lastParent = null;
  rows.forEach(r => { if (/^·\s/.test(r.label) && lastParent && !kidOf.has(r.label)) { kidOf.set(r.label, lastParent.label); (lastParent._auto = lastParent._auto || []).push(r.label); } else if (!/^·\s/.test(r.label)) lastParent = r; });
  const parents = new Set([...kidOf.values()]), done = new Set();
  const ids = new Map([...parents].map(l => [l, "tg" + (++togSeq)]));
  const emitParent = p => { if (done.has(p.label)) return; done.add(p.label); out.push({row: p, role: "parent", id: ids.get(p.label)});
    rows.filter(k => kidOf.get(k.label) === p.label).forEach(k => { done.add(k.label); out.push({row: k, role: "kid", id: ids.get(p.label)}); }); };
  rows.forEach(r => {
    if (done.has(r.label)) return;
    if (kidOf.has(r.label)) { const p = byLabel.get(kidOf.get(r.label)); if (p) emitParent(p); return; }
    if (parents.has(r.label)) { emitParent(r); return; }
    done.add(r.label); out.push({row: r, role: "plain"});
  });
  return out;
}

function chgCell(a, b, isMargin) {
  if (!isNum(a) || !isNum(b)) return `<td class="faint">–</td>`;
  if (isMargin) { const d = (a - b) * 100; return `<td class="${cls(d)}">${sign(d)}${fx(d, 1)}%p</td>`; }
  if (b <= 0 && a > 0) return `<td class="up">흑자전환</td>`;
  if (b > 0 && a <= 0) return `<td class="down">적자전환</td>`;
  if (b < 0 && a < 0) return `<td class="${a > b ? "up" : "down"}">${a > b ? "적자축소" : "적자확대"}</td>`;
  if (b === 0) return `<td class="faint">–</td>`;
  const g = a / b - 1; return `<td class="${cls(g)}">${fpct(g)}</td>`;
}
function miniBars(title, vals, labels, fmt) {
  const W = 220, H = 120, top = 18, bot = 20, n = vals.length;
  const good = vals.filter(isNum);
  if (!good.length) return "";
  const mx = Math.max(0, ...good), mn = Math.min(0, ...good), span = mx - mn || 1;
  const Y = v => top + (mx - v) / span * (H - top - bot);
  const bw = (W - 8) / n;
  let s = `<line x1="0" y1="${Y(0)}" x2="${W}" y2="${Y(0)}" stroke="var(--line)"/>`;
  vals.forEach((v, i) => {
    const x = 4 + i * bw + bw * 0.18, w = bw * 0.64, last = i === n - 1;
    if (isNum(v)) {
      const y0 = Y(Math.max(v, 0)), y1 = Y(Math.min(v, 0));
      s += `<rect x="${x}" y="${y0}" width="${w}" height="${Math.max(1, y1 - y0)}" rx="2" fill="${last ? "var(--accent)" : v < 0 ? "var(--down-soft)" : "var(--line)"}"/>`;
      s += `<text x="${x + w / 2}" y="${v >= 0 ? y0 - 4 : y1 + 11}" text-anchor="middle" font-size="9.5" fill="${last ? "var(--accent)" : "var(--muted)"}" font-weight="${last ? 700 : 400}" style="font-family:var(--mono)">${fmt(v)}</text>`;
    }
    s += `<text x="${x + w / 2}" y="${H - 5}" text-anchor="middle" font-size="9" fill="var(--faint)" style="font-family:var(--mono)">${labels[i]}</text>`;
  });
  return `<div class="mini"><span class="lbl">${title}</span><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${s}</svg></div>`;
}

  niceTicks(lo, hi).forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${Yv(v)}" y2="${Yv(v)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${L - 6}" y="${Yv(v) + 3}" text-anchor="end" font-size="10" fill="var(--faint)" style="font-family:var(--mono)">${cur === "KRW" ? fx(v / 1000, 0) + "k" : fx(v, v >= 100 ? 0 : 1)}</text>`; });
  const line = c.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Yv(v).toFixed(1)}`).join(" ");
  const chg = c[c.length - 1] / base - 1, col = chg >= 0 ? "var(--up)" : "var(--down)";
  s += `<path d="${line} L${X(c.length - 1)} ${H - B} L${X(0)} ${H - B}Z" fill="${col}" fill-opacity=".08"/>`;
  if (isDay && isNum(base)) s += `<line x1="${L}" x2="${W - R}" y1="${Yv(base)}" y2="${Yv(base)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W - R}" y="${Yv(base) - 5}" text-anchor="end" font-size="10.5" fill="var(--muted)" style="font-family:var(--mono)">전일 종가 ${fpx(base, cur)}</text>`;
  s += `<path d="${line}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>`;
  if (tgt && tgt <= hi && tgt >= lo) s += `<line x1="${L}" x2="${W - R}" y1="${Yv(tgt)}" y2="${Yv(tgt)}" stroke="var(--accent)" stroke-dasharray="6 4" stroke-width="1.4"/><text x="${W - R}" y="${Yv(tgt) - 5}" text-anchor="end" font-size="10.5" fill="var(--accent)" font-weight="700" style="font-family:var(--mono)">평균 목표가 ${fpx(tgt, cur)}</text>`;
  if (isNum(myT) && myT <= hi && myT >= lo) s += `<line x1="${L}" x2="${W - R}" y1="${Yv(myT)}" y2="${Yv(myT)}" stroke="var(--warn)" stroke-dasharray="3 3" stroke-width="1.2"/><text x="${L + 4}" y="${Yv(myT) - 5}" font-size="10.5" fill="var(--warn)" style="font-family:var(--mono)">내 목표가 ${fpx(myT, cur)}</text>`;
  s += `<circle cx="${X(c.length - 1)}" cy="${Yv(c[c.length - 1])}" r="4" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
  // x labels
  const lab = (i, t) => { s += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--faint)" style="font-family:var(--mono)">${t}</text>`; };
  if (isDay) {
    const step = Math.max(1, Math.round(rows.length / 5));
    rows.forEach((r, i) => { if (i % step === 0) lab(i, kstHM(r[0])); });
  } else if (chartRange === "w1") {
    let prev = "";
    rows.forEach((r, i) => { const d = kstMD(r[0]); if (d !== prev) { lab(i, d); prev = d; } });
  } else {
    let prev = "";
    rows.forEach((r, i) => { const m = String(r[0]).slice(0, 7); if (m !== prev && i > 0) { if (+m.slice(5) % 2 === 1) lab(i, m.slice(2).replace("-", ".")); } prev = m; });
  }
  const sub = isDay ? `${kstMD(rows[0][0])} 미국장 · 시간은 한국 기준` : chartRange === "w1" ? "최근 5거래일 · 1시간 간격" : "최근 1년 · 주간 종가";
  el.innerHTML = `<div class="chart-head"><h3>주가 차트 <small class="${cls(chg)}" style="font-family:var(--mono);font-size:12px">${fpct(chg, 2)}</small><small class="faint" style="font-size:11px;font-weight:400">${sub}</small></h3>${seg}</div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(RANGES.find(r => r[0] === chartRange)[1])} 주가 차트">${s}</svg></div>`;
}
function renderUD() {
  const el = $("#d-ud"); if (!el) return;
  const rows = Array.isArray(D.ud) ? D.ud : [];
  const head = `<div class="ud-head"><span class="lbl">최근 증권사 의견 · 6개월</span>${rows.length ? `<span class="faint" style="font-size:11px">${rows.length}건 · 스크롤해서 더 보기</span>` : ""}</div>`;
  if (!rows.length) { el.innerHTML = head + `<div class="note">최근 6개월 의견 변경이 없어요.</div>`; return; }
  const cur = (D.info || {}).currency;
  const act = r => r.Action === "up" ? ["등급 상향", "up"] : r.Action === "down" ? ["등급 하향", "down"] : r.Action === "init" ? ["신규", "flat"]
    : r.priceTargetAction === "Raises" ? ["목표가 ↑", "up"] : r.priceTargetAction === "Lowers" ? ["목표가 ↓", "down"] : ["유지", "flat"];
  el.innerHTML = head + `<div class="ud ud-scroll" tabindex="0" aria-label="최근 증권사 의견 목록">${rows.map(r => {
    const a = act(r), d = String(r.GradeDate || "").slice(5, 10).replace("-", ".");
    const g = r.FromGrade && r.FromGrade !== r.ToGrade ? `${esc(r.FromGrade)} → ${esc(r.ToGrade)}` : esc(r.ToGrade || "");
    const tp = isNum(r.currentPriceTarget) && r.currentPriceTarget > 0
      ? (isNum(r.priorPriceTarget) && r.priorPriceTarget > 0 && r.priorPriceTarget !== r.currentPriceTarget ? `<span class="faint">${fpx(r.priorPriceTarget, cur)} →</span> ` : "") + `<b>${fpx(r.currentPriceTarget, cur)}</b>` : "–";
    return `<div class="ud-row"><span class="d">${d}</span><span><b>${esc(r.Firm)}</b><span class="tag ${a[1]}">${a[0]}</span></span><span class="tp">${tp}</span><span class="d"></span><span class="g">${g}</span></div>`;
  }).join("")}</div>`;
}
function renderMemo() {
  const el = $("#d-memo"); if (!el || !canEdit) return;
  if (el.dataset.t === current && el.contains(document.activeElement)) return;
  el.dataset.t = current;
  const m = memos[docId(current)] || {};
  const q = D.info || {}, cur = q.currency;
  const gap = isNum(m.myTarget) && isNum(q.currentPrice) ? m.myTarget / q.currentPrice - 1 : NaN;
  el.innerHTML = `<h3>내 메모 <small>나에게만 보여요${isNum(gap) ? ` · 내 목표가까지 <span class="${cls(gap)}">${fpct(gap)}</span>` : ""}</small></h3>
    <div class="memo">
      <label for="memo-target">내 목표가 (${esc(cur || "USD")})<input id="memo-target" type="number" step="any" inputmode="decimal" value="${isNum(m.myTarget) ? m.myTarget : ""}"></label>
      <label for="memo-text">투자 아이디어 · 체크포인트<textarea id="memo-text" maxlength="4000">${esc(m.note || "")}</textarea></label>
    </div>
    <div style="display:flex;gap:10px;align-items:center"><button class="btn primary" type="button" data-act="savememo">메모 저장</button><span class="note" id="memo-msg"></span></div>`;
}

function renderAll() {
  renderStatus(); renderTiles(); computeFG(); renderLedger(); renderHeatmap();
  if (current) renderDetail();
  else if (pendingHash && stockData(pendingHash)) { const h = pendingHash; pendingHash = null; openStock(h, true); }
}

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  if (ev.target.closest(".grip") || Date.now() - dragEndAt < 250) return;
  const zb = ev.target.closest("[data-zoom]");
  if (zb) { hmZoom = zb.dataset.zoom || null; renderHeatmap(); return; }
  const fb = ev.target.closest("[data-fin]");
  if (fb) { finMode = fb.dataset.fin; try { localStorage.setItem("pydesk.fin", finMode); } catch {} renderQ(); return; }
  const rb = ev.target.closest("[data-range]");
  if (rb) { chartRange = rb.dataset.range; try { localStorage.setItem("pydesk.range", chartRange); } catch {} renderChart(); return; }
  const t = ev.target.closest("[data-add],[data-del],[data-open],[data-act]");
  if (!t) return;
  if (t.dataset.add) { ev.stopPropagation(); await addTicker(t.dataset.add); return; }
  if (t.dataset.del) {
    ev.stopPropagation();
    if (!t.classList.contains("confirm")) {
      t.classList.add("confirm"); t.textContent = "삭제";
      setTimeout(() => { if (t.isConnected) { t.classList.remove("confirm"); t.textContent = "×"; } }, 3000);
      return;
    }
    await removeTicker(t.dataset.del); return;
  }
  if (t.dataset.open) { openStock(t.dataset.open); return; }
  const a = t.dataset.act;
  if (a === "home") goHome();
  else if (a === "savememo") {
    const v = $("#memo-target").value.trim();
    const n = v === "" ? null : Number(v);
    if (v !== "" && !isFinite(n)) { $("#memo-msg").textContent = "목표가는 숫자로 입력해 주세요."; return; }
    try {
      await db.collection("memo").doc(docId(current)).set({ticker: current, myTarget: n, note: $("#memo-text").value, updatedAt: Date.now()});
      document.activeElement && document.activeElement.blur();
      renderMemo(); renderChart();
      $("#memo-msg").textContent = "저장했어요";
    } catch (e) { $("#memo-msg").textContent = "저장하지 못했어요: " + (e && e.message || ""); }
  }
});
document.addEventListener("keydown", ev => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches(".row.item, .hm-tile.mine")) { ev.preventDefault(); openStock(ev.target.dataset.open); }
});
$("#addform").addEventListener("submit", ev => { ev.preventDefault(); const i = $("#add-input"); addTicker(i.value); i.value = ""; });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadSnapshot(); });

/* ---------- boot ---------- */
try { const h = decodeURIComponent((location.hash || "").slice(1)).toUpperCase(); if (h && /^[A-Z0-9._~-]{1,14}$/.test(h)) pendingHash = h; } catch {}
drawGauge(NaN);
setSyncNote();
loadSnapshot();
setInterval(loadSnapshot, 10 * 60 * 1000);

(async () => {
  const C = window.claude;
  if (!C || typeof C.use !== "function") return;
  const [d, u] = await Promise.all(["db", "user"].map(n => C.use(n).catch(() => null)));
  try { canEdit = u ? await u.isOwner() || await u.canEdit() : false; } catch { canEdit = false; }
  if (!d || !canEdit) return;
  db = d;
  $("#addform").hidden = false;
  setSyncNote();
  db.collection("watch").orderBy("addedAt").onSnapshot(s => {
    watchDocs = s.docs.map(x => ({...x.data()})).filter(x => x && x.ticker);   // snapshot bodies are frozen: copy
    if (localOrder) {
      const fromDb = sortedWatch().map(x => x.ticker).join(",");
      const want = localOrder.filter(t => watchDocs.some(x => x.ticker === t)).join(",");
      if (fromDb === want && !s.metadata?.hasPendingWrites) localOrder = null;
    }
    renderLedger();
    renderHeatmap();
  }, () => { watchDocs = null; renderLedger(); });
  db.collection("memo").onSnapshot(s => {
    memos = {}; s.docs.forEach(x => memos[x.id] = x.data());
    if (current) { renderMemo(); renderChart(); }
  }, () => {});
  if (current) renderDetail();
})();
})();
</script>

</body>
</html>
